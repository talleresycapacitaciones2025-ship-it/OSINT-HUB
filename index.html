<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OSINT HUB · Matrix Nexus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: 'Courier New', 'Fira Code', monospace;
            color: #0f0;
            padding: 20px;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Efecto de fondo matrix dinámico (solo oscuro) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.02) 0px, rgba(0, 255, 0, 0.02) 2px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #0f0;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            text-shadow: 0 0 8px #0f0;
            word-break: break-word;
        }

        .tagline {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Barra de herramientas superior */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
            background: rgba(0, 20, 0, 0.5);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
        }
        .toolbar button {
            background: #0a0f0a;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 6px 14px;
            border-radius: 30px;
            font-family: monospace;
            cursor: pointer;
            transition: 0.2s;
        }
        .toolbar button:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 8px #0f0;
        }
        .stats {
            background: rgba(0, 30, 0, 0.7);
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .theme-selector {
            display: flex;
            gap: 8px;
            background: rgba(0, 30, 0, 0.6);
            padding: 4px 12px;
            border-radius: 40px;
        }
        .theme-btn {
            background: none;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .theme-btn.active {
            background: #0f0;
            color: #000;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }
        .filter-btn {
            background: #0a0f0a;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 6px #0f0;
        }

        .search-bar {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
        .search-bar input {
            width: 80%;
            max-width: 500px;
            background: #111;
            border: 1px solid #0f0;
            padding: 10px 18px;
            color: #0f0;
            font-family: monospace;
            border-radius: 40px;
            outline: none;
        }

        .category {
            margin-bottom: 40px;
            background: rgba(0, 20, 0, 0.3);
            border-left: 4px solid #0f0;
            padding: 15px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .category h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 1px dashed #0f0;
            display: inline-block;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }
        .tool-card {
            background: #0a0f0a;
            border: 1px solid #0f0;
            border-radius: 14px;
            padding: 14px;
            transition: 0.2s;
            position: relative;
        }
        .tool-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 14px rgba(0,255,0,0.5);
        }
        .tool-name {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .tool-desc {
            font-size: 0.8rem;
            color: #cfc;
            margin-bottom: 10px;
        }
        .tool-link a {
            color: #0f0;
            word-break: break-all;
            font-size: 0.8rem;
        }
        .status {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .status.green { background: #0f0; color: #000; }
        .status.yellow { background: #ccff00; color: #1a1a1a; }
        .status.red { background: #f33; color: #000; }
        .tool-actions {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .tool-actions button {
            background: none;
            border: 1px solid #2f2f2f;
            color: #8f8;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 20px;
            cursor: pointer;
        }
        .tool-actions button:hover {
            background: #0f0;
            color: #000;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0a0f0a;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 10000;
            backdrop-filter: blur(8px);
            font-size: 0.8rem;
            animation: fadeOut 3s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 15px;
            border-top: 1px solid #0f0;
            font-size: 0.7rem;
        }

        /* ===== TEMA CLARO ===== */
        body.light-theme {
            background-color: #eef4ee;
            color: #004d00;
        }
        body.light-theme::before { background: none; }
        body.light-theme .header { border-bottom-color: #2b6e2b; }
        body.light-theme h1 { text-shadow: 0 0 4px #2b6e2b; color: #004d00; }
        body.light-theme .toolbar, body.light-theme .theme-selector, body.light-theme .stats { background: rgba(100,120,100,0.2); }
        body.light-theme button, body.light-theme .filter-btn, body.light-theme .toolbar button {
            background: #e0e8e0;
            border-color: #2b6e2b;
            color: #004d00;
        }
        body.light-theme button:hover, body.light-theme .filter-btn.active {
            background: #2b6e2b;
            color: #fff;
        }
        body.light-theme .search-bar input {
            background: #fff;
            border-color: #2b6e2b;
            color: #004d00;
        }
        body.light-theme .category { background: rgba(200,220,200,0.3); border-left-color: #2b6e2b; }
        body.light-theme .category h2 { border-bottom-color: #2b6e2b; color: #004d00; }
        body.light-theme .tool-card { background: #fff; border-color: #2b6e2b; }
        body.light-theme .tool-desc { color: #115511; }
        body.light-theme .tool-link a { color: #006600; }
        body.light-theme .tool-actions button { border-color: #88aa88; color: #006600; }
        body.light-theme .tool-actions button:hover { background: #2b6e2b; color: #fff; }
        body.light-theme .status.green { background: #2b6e2b; color: #fff; }
        body.light-theme .status.yellow { background: #b9a300; color: #fff; }
        body.light-theme .status.red { background: #c33; color: #fff; }
        body.light-theme footer { border-top-color: #2b6e2b; }

        /* ===== TEMA ÁMBAR ===== */
        body.amber-theme {
            background-color: #1c160c;
            color: #ffb347;
        }
        body.amber-theme::before { background: repeating-linear-gradient(0deg, rgba(255, 180, 71, 0.03) 0px, rgba(255, 180, 71, 0.03) 2px, transparent 2px, transparent 6px); }
        body.amber-theme .header { border-bottom-color: #ffb347; }
        body.amber-theme h1 { text-shadow: 0 0 8px #ffb347; color: #ffb347; }
        body.amber-theme .toolbar, body.amber-theme .theme-selector, body.amber-theme .stats { background: rgba(255, 180, 71, 0.15); }
        body.amber-theme button, body.amber-theme .filter-btn, body.amber-theme .toolbar button {
            background: #2a2418;
            border-color: #ffb347;
            color: #ffb347;
        }
        body.amber-theme button:hover, body.amber-theme .filter-btn.active {
            background: #ffb347;
            color: #1c160c;
        }
        body.amber-theme .search-bar input {
            background: #2a2418;
            border-color: #ffb347;
            color: #ffb347;
        }
        body.amber-theme .category { background: rgba(255, 180, 71, 0.08); border-left-color: #ffb347; }
        body.amber-theme .category h2 { border-bottom-color: #ffb347; color: #ffb347; }
        body.amber-theme .tool-card { background: #2a2418; border-color: #ffb347; }
        body.amber-theme .tool-desc { color: #ffcc88; }
        body.amber-theme .tool-link a { color: #ffb347; }
        body.amber-theme .tool-actions button { border-color: #ffb347; color: #ffb347; }
        body.amber-theme .tool-actions button:hover { background: #ffb347; color: #1c160c; }
        body.amber-theme .status.green { background: #ffb347; color: #1c160c; }
        body.amber-theme .status.yellow { background: #ffaa33; color: #1c160c; }
        body.amber-theme .status.red { background: #ff6644; color: #1c160c; }
        body.amber-theme footer { border-top-color: #ffb347; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 id="mainTitle">OSINT HUB // MATRIX NEXUS</h1>
        <div class="tagline">→ herramientas OSINT actualizadas · verificación dinámica · temas personalizables ←</div>
        <div class="toolbar">
            <button id="exportCsvBtn">📎 Exportar CSV</button>
            <button id="exportJsonBtn">📄 Exportar JSON</button>
            <div class="stats" id="statsCounter">🔧 herramientas: --</div>
            <div class="theme-selector">
                <button class="theme-btn" data-theme="dark">🌙 Matrix</button>
                <button class="theme-btn" data-theme="light">☀️ Claro</button>
                <button class="theme-btn" data-theme="amber">🟠 Ámbar</button>
            </div>
        </div>
    </div>

    <div class="filter-buttons" id="filterButtons">
        <button class="filter-btn active" data-category="all">📌 Todas</button>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔎 buscar herramienta por nombre o descripción...">
    </div>

    <div id="categoriesContainer"></div>

    <footer>
        ⚡ OSINT HUB · verificación manual con fetch | exportación CSV/JSON | temas: Matrix, Claro, Ámbar<br>
        ¿Enlace roto? Usa "🔄 Verificar" y reporta mediante issues de GitHub.
    </footer>
</div>

<script>
    // ==================== BASE DE DATOS (completa) ====================
    const toolsData = {
        "Búsqueda de dominios / WHOIS": [
            { name: "Whois.domaintools", desc: "WHOIS completo e histórico.", url: "https://whois.domaintools.com", status: "green" },
            { name: "SecurityTrails", desc: "DNS histórico y subdominios.", url: "https://securitytrails.com", status: "green" },
            { name: "ViewDNS.info", desc: "Múltiples herramientas DNS.", url: "https://viewdns.info", status: "green" },
            { name: "ICANN Lookup", desc: "WHOIS oficial.", url: "https://lookup.icann.org", status: "green" },
            { name: "DNSDumpster", desc: "Mapeo de subdominios.", url: "https://dnsdumpster.com", status: "green" },
            { name: "DNSlytics", desc: "Historial de dominios.", url: "https://dnslytics.com", status: "green" }
        ],
        "Redes sociales": [
            { name: "Social Searcher", desc: "Búsqueda en redes.", url: "https://www.social-searcher.com", status: "green" },
            { name: "Social Analyzer", desc: "API + web para +1000 redes.", url: "https://github.com/weisk/social-analyzer", status: "green" },
            { name: "WhatsMyName", desc: "Verifica usuarios.", url: "https://whatsmyname.app", status: "green" },
            { name: "Namechk", desc: "Disponibilidad de usuario.", url: "https://namechk.com", status: "green" },
            { name: "Maigret", desc: "Buscador CLI/web.", url: "https://maigret.secapps.com", status: "green" }
        ],
        "Correos electrónicos y usuarios": [
            { name: "Hunter.io", desc: "Buscador de correos.", url: "https://hunter.io", status: "green" },
            { name: "EmailRep.io", desc: "Reputación de email.", url: "https://emailrep.io", status: "green" },
            { name: "Have I Been Pwned", desc: "Filtraciones.", url: "https://haveibeenpwned.com", status: "green" },
            { name: "DeHashed", desc: "Base de filtraciones.", url: "https://dehashed.com", status: "green" },
            { name: "Epieos", desc: "Búsqueda inversa email/teléfono.", url: "https://epieos.com", status: "green" }
        ],
        "Geolocalización y mapas": [
            { name: "Google Maps", desc: "Mapas y Street View.", url: "https://maps.google.com", status: "green" },
            { name: "Wikimapia", desc: "Mapa colaborativo.", url: "https://wikimapia.org", status: "green" },
            { name: "SunCalc", desc: "Posición del sol.", url: "https://suncalc.org", status: "green" },
            { name: "GeoCreepy", desc: "Geolocalización Telegram.", url: "https://github.com/ikkz/geocreepy", status: "green" },
            { name: "OpenStreetMap", desc: "Mapas libres.", url: "https://www.openstreetmap.org", status: "green" },
            { name: "Google Earth", desc: "Imágenes satelitales.", url: "https://earth.google.com", status: "green" }
        ],
        "Archivos web (Wayback Machine)": [
            { name: "Wayback Machine", desc: "Archivo web gigante.", url: "https://archive.org/web/", status: "green" },
            { name: "Archive.today", desc: "Capturas instantáneas.", url: "https://archive.is", status: "green" },
            { name: "Ghostarchive", desc: "Archiva páginas.", url: "https://ghostarchive.org", status: "green" },
            { name: "Perma.cc", desc: "Enlaces permanentes.", url: "https://perma.cc", status: "green" },
            { name: "Arquivo.pt", desc: "Archivo portugués.", url: "https://arquivo.pt", status: "green" }
        ],
        "Imágenes y metadatos": [
            { name: "Google Images", desc: "Búsqueda inversa.", url: "https://images.google.com", status: "green" },
            { name: "TinEye", desc: "Búsqueda perceptual.", url: "https://tineye.com", status: "green" },
            { name: "VerEXIF", desc: "Metadatos EXIF.", url: "https://www.verexif.com", status: "green" },
            { name: "FotoForensics", desc: "Análisis forense.", url: "https://fotoforensics.com", status: "green" },
            { name: "Yandex Images", desc: "Buscador ruso.", url: "https://yandex.com/images", status: "green" }
        ],
        "Código fuente y repositorios": [
            { name: "GitHub Search", desc: "Búsqueda en repos.", url: "https://github.com/search", status: "green" },
            { name: "GitLab Explore", desc: "Repos públicos.", url: "https://gitlab.com/explore", status: "green" },
            { name: "SourceGraph", desc: "Búsqueda semántica.", url: "https://sourcegraph.com/search", status: "green" },
            { name: "PublicWWW", desc: "Fragmentos en webs.", url: "https://publicwww.com", status: "green" }
        ],
        "Datos gubernamentales": [
            { name: "Data.gov", desc: "Datos EE.UU.", url: "https://data.gov", status: "green" },
            { name: "European Data Portal", desc: "Datos UE.", url: "https://data.europa.eu", status: "green" },
            { name: "INE España", desc: "Estadísticas.", url: "https://www.ine.es", status: "green" },
            { name: "World Bank Open Data", desc: "Datos económicos.", url: "https://data.worldbank.org", status: "green" }
        ],
        "Foros y dark web (superficie)": [
            { name: "Reddit r/OSINT", desc: "Comunidad OSINT.", url: "https://www.reddit.com/r/OSINT", status: "green" },
            { name: "Hack Forums", desc: "Foro hacking.", url: "https://hackforums.net", status: "green" },
            { name: "Ahmia", desc: "Buscador onion.", url: "https://ahmia.fi", status: "green" }
        ],
        "Motores infraestructura": [
            { name: "Shodan", desc: "Dispositivos conectados.", url: "https://www.shodan.io", status: "green" },
            { name: "Censys", desc: "Descubrimiento activos.", url: "https://censys.io", status: "green" },
            { name: "ZoomEye", desc: "Dispositivos red.", url: "https://www.zoomeye.org", status: "green" },
            { name: "Criminal IP", desc: "Superficie ataque.", url: "https://www.criminalip.io", status: "green" }
        ]
    };

    const categoriesOrder = Object.keys(toolsData);
    let totalTools = Object.values(toolsData).reduce((acc, arr) => acc + arr.length, 0);

    // Estado
    let currentCategory = "all";
    let searchTerm = "";

    // Elementos DOM
    const container = document.getElementById("categoriesContainer");
    const statsSpan = document.getElementById("statsCounter");
    const searchInput = document.getElementById("searchInput");
    const filterDiv = document.getElementById("filterButtons");

    // Helper: notificaciones toast
    function showToast(msg, isError = false) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.style.borderColor = isError ? "#f33" : "#0f0";
        toast.style.color = isError ? "#faa" : "#0f0";
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // Verificar URL (fetch con timeout)
    async function checkUrl(url) {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            const res = await fetch(url, { method: 'HEAD', mode: 'no-cors', signal: controller.signal });
            clearTimeout(timeoutId);
            // con no-cors no podemos saber el estado real, pero si no hay excepción asumimos reachable
            return true;
        } catch (e) {
            return false;
        }
    }

    // Actualizar estado de una herramienta específica y guardar en localStorage
    async function verifyAndUpdate(cat, toolName, url, cardElement) {
        const statusSpan = cardElement.querySelector(`.status`);
        const oldClass = statusSpan.classList[1];
        statusSpan.innerText = "🟡 verificando...";
        statusSpan.className = "status yellow";
        const isAlive = await checkUrl(url);
        if (isAlive) {
            statusSpan.innerText = "🟢 activo";
            statusSpan.className = "status green";
            // Actualizar datos internos (persistir)
            const tool = toolsData[cat].find(t => t.name === toolName);
            if (tool) tool.status = "green";
        } else {
            statusSpan.innerText = "🔴 caído";
            statusSpan.className = "status red";
            const tool = toolsData[cat].find(t => t.name === toolName);
            if (tool) tool.status = "red";
        }
        // Guardar en localStorage para mantener verificaciones
        localStorage.setItem("osint_custom_status", JSON.stringify(toolsData));
        showToast(`Verificado: ${toolName} → ${isAlive ? "activo" : "caído"}`, !isAlive);
    }

    // Renderizado principal
    function render() {
        container.innerHTML = "";
        let categoriesToShow = categoriesOrder;
        if (currentCategory !== "all") {
            if (categoriesOrder.includes(currentCategory)) categoriesToShow = [currentCategory];
            else categoriesToShow = [];
        }

        let visibleCount = 0;
        for (let cat of categoriesToShow) {
            let tools = toolsData[cat];
            if (!tools) continue;
            let filtered = tools;
            if (searchTerm) {
                filtered = tools.filter(t => t.name.toLowerCase().includes(searchTerm) || t.desc.toLowerCase().includes(searchTerm));
            }
            if (filtered.length === 0) continue;
            visibleCount += filtered.length;

            const catDiv = document.createElement("div");
            catDiv.className = "category";
            catDiv.innerHTML = `<h2>📁 ${cat}</h2><div class="tools-grid" id="grid-${cat.replace(/\s/g, '')}"></div>`;
            container.appendChild(catDiv);
            const grid = catDiv.querySelector(".tools-grid");

            filtered.forEach(tool => {
                const statusClass = tool.status === "green" ? "green" : (tool.status === "yellow" ? "yellow" : "red");
                const statusText = tool.status === "green" ? "🟢 activo" : (tool.status === "yellow" ? "🟡 inestable" : "🔴 caído");
                const card = document.createElement("div");
                card.className = "tool-card";
                card.innerHTML = `
                    <div class="tool-name">
                        <span>🔧 ${tool.name}</span>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="tool-desc">📄 ${tool.desc}</div>
                    <div class="tool-link">🔗 <a href="${tool.url}" target="_blank" rel="noopener noreferrer">${tool.url}</a></div>
                    <div class="tool-actions">
                        <button class="verify-btn">🔄 Verificar</button>
                        <button class="report-btn-custom">⚠️ Reportar</button>
                    </div>
                `;
                grid.appendChild(card);

                const verifyBtn = card.querySelector(".verify-btn");
                verifyBtn.addEventListener("click", () => verifyAndUpdate(cat, tool.name, tool.url, card));

                const reportBtn = card.querySelector(".report-btn-custom");
                reportBtn.addEventListener("click", () => {
                    const body = `Herramienta: ${tool.name}\nCategoría: ${cat}\nURL: ${tool.url}\nProblema: `;
                    window.open(`https://github.com/TU-USUARIO/osint-matrix-hub/issues/new?title=[Reporte] ${tool.name}&body=${encodeURIComponent(body)}`, '_blank');
                    showToast("Redirigiendo a GitHub para reportar...");
                });
            });
        }
        statsSpan.innerText = `🔧 Herramientas: ${visibleCount} / ${totalTools}`;
        if (visibleCount === 0) container.innerHTML = "<div style='text-align:center; padding:40px;'>🔍 No hay coincidencias</div>";
    }

    // Exportar a CSV
    function exportCSV() {
        let rows = [["Categoría", "Nombre", "Descripción", "URL", "Estado"]];
        for (let cat in toolsData) {
            toolsData[cat].forEach(t => {
                rows.push([cat, t.name, t.desc, t.url, t.status]);
            });
        }
        const csv = rows.map(row => row.map(cell => `"${cell}"`).join(",")).join("\n");
        const blob = new Blob([csv], {type: "text/csv"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "osint_hub_export.csv";
        link.click();
        showToast("Exportado a CSV");
    }

    function exportJSON() {
        const data = JSON.stringify(toolsData, null, 2);
        const blob = new Blob([data], {type: "application/json"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "osint_hub_export.json";
        link.click();
        showToast("Exportado a JSON");
    }

    // Filtros URL (hash)
    function updateURL() {
        let params = new URLSearchParams();
        if (currentCategory !== "all") params.set("cat", currentCategory);
        if (searchTerm) params.set("search", searchTerm);
        const newUrl = `${window.location.pathname}?${params.toString()}`;
        window.history.replaceState({}, "", newUrl);
    }

    function loadFromURL() {
        const params = new URLSearchParams(window.location.search);
        const cat = params.get("cat");
        const search = params.get("search");
        if (cat && categoriesOrder.includes(cat)) {
            currentCategory = cat;
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.classList.remove("active");
                if (btn.getAttribute("data-category") === cat) btn.classList.add("active");
            });
        } else {
            currentCategory = "all";
            document.querySelectorAll(".filter-btn").forEach(btn => {
                if (btn.getAttribute("data-category") === "all") btn.classList.add("active");
                else btn.classList.remove("active");
            });
        }
        if (search) {
            searchTerm = search;
            searchInput.value = search;
        } else {
            searchTerm = "";
            searchInput.value = "";
        }
        render();
    }

    // Inicializar filtros
    function initFilters() {
        filterDiv.innerHTML = `<button class="filter-btn active" data-category="all">📌 Todas</button>`;
        categoriesOrder.forEach(cat => {
            const btn = document.createElement("button");
            btn.className = "filter-btn";
            btn.setAttribute("data-category", cat);
            btn.innerText = cat;
            filterDiv.appendChild(btn);
        });
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentCategory = btn.getAttribute("data-category");
                updateURL();
                render();
            });
        });
    }

    // Temas
    function applyTheme(theme) {
        document.body.classList.remove("light-theme", "amber-theme");
        if (theme === "light") document.body.classList.add("light-theme");
        else if (theme === "amber") document.body.classList.add("amber-theme");
        localStorage.setItem("osint_theme", theme);
        document.querySelectorAll(".theme-btn").forEach(btn => {
            btn.classList.remove("active");
            if (btn.getAttribute("data-theme") === theme) btn.classList.add("active");
        });
    }

    // Cargar temas guardados y estados personalizados
    function loadPersisted() {
        const savedTheme = localStorage.getItem("osint_theme");
        if (savedTheme && ["dark","light","amber"].includes(savedTheme)) applyTheme(savedTheme);
        else applyTheme("dark");
        const savedStatus = localStorage.getItem("osint_custom_status");
        if (savedStatus) {
            try {
                const parsed = JSON.parse(savedStatus);
                for (let cat in parsed) {
                    if (toolsData[cat]) {
                        for (let i=0; i<parsed[cat].length; i++) {
                            if (toolsData[cat][i] && toolsData[cat][i].name === parsed[cat][i].name) {
                                toolsData[cat][i].status = parsed[cat][i].status;
                            }
                        }
                    }
                }
            } catch(e) {}
        }
        render();
    }

    // Eventos
    document.getElementById("exportCsvBtn").addEventListener("click", exportCSV);
    document.getElementById("exportJsonBtn").addEventListener("click", exportJSON);
    searchInput.addEventListener("input", (e) => {
        searchTerm = e.target.value.toLowerCase();
        updateURL();
        render();
    });
    document.querySelectorAll(".theme-btn").forEach(btn => {
        btn.addEventListener("click", () => applyTheme(btn.getAttribute("data-theme")));
    });

    initFilters();
    loadPersisted();
    loadFromURL();
    window.addEventListener("popstate", loadFromURL);
</script>
</body>
</html>
