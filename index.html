<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OSINT HUB · Matrix Nexus</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>OSINT HUB // MATRIX NEXUS</h1>
        <div class="tagline">→ herramientas OSINT actualizadas · verificación manual · temas personalizables ←</div>
        <div class="toolbar">
            <div class="stats" id="statsCounter">🔧 herramientas: --</div>
            <div class="theme-selector">
                <button class="theme-btn" data-theme="dark">🌙 Matrix</button>
                <button class="theme-btn" data-theme="light">☀️ Claro</button>
                <button class="theme-btn" data-theme="amber">🟠 Ámbar</button>
            </div>
        </div>
    </div>

    <div class="filter-buttons" id="filterButtons">
        <button class="filter-btn active" data-category="all">📌 Todas</button>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔎 buscar herramienta por nombre o descripción...">
    </div>

    <div id="categoriesContainer"></div>

    <footer>
        ⚡ OSINT HUB · verificación local | temas: Matrix, Claro, Ámbar<br>
        Los estados se guardan en tu navegador. Sin envío de datos.
    </footer>
</div>

<script src="js/script.js"></script>
</body>
</html>
